name: Docs

# Builds the documentation site on every pull request that touches it.
# Cloudflare builds and publishes it (https://docs.itero.sh) from main; see
# docs/README.md.
on:
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from docs/.node-version, the one place it is written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.node-version

      # Yarn 4 from package.json's packageManager; --immutable fails on a
      # yarn.lock that is out of date instead of resolving new versions.
      - name: Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Test the build check
        run: yarn test

      - name: Build
        run: yarn build

