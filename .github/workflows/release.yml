name: Release

# On a version tag: a draft release, an archive per target made by `make dist`
# (the recipe scripts/test-install.sh installs from, so the names the install
# script expects and the names published here are one and the same), then the
# release is published. It first runs once the repository exists.
on:
  push:
    tags: ["v*"]

# Read-only by default; each job that writes to the release says so.
permissions:
  contents: read

jobs:
  # Uploads go to an existing release; pushing a tag does not make one. A
  # draft, so a failed build keeps it from going public.
  create-release:
    name: create draft release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    steps:
      - name: Create or reuse the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists, reusing it"
          else
            # the install line, then GitHub's notes: the PRs merged since
            # the last tag, by their titles
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --notes "itero $GITHUB_REF_NAME. Install: curl -fsSL https://itero.sh/install | sh" \
              --generate-notes
          fi

  build:
    needs: create-release
    name: build ${{ matrix.target }}
    strategy:
      # one target failing must not cancel the others
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # cross built on the Apple Silicon runner: Rust targets Intel Macs
          # from there, and codesign signs either
          - target: x86_64-apple-darwin
            os: macos-latest
          # the oldest Ubuntu runners: built here, itero needs glibc 2.34, so
          # it runs on Ubuntu 22.04, Debian 12, RHEL 9 and later.
          # Built on 24.04 it needed glibc 2.39.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # uploads the archives to the draft release
    # the default is 6 hours; no build here needs a fraction of that
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # nothing later in the job pushes or fetches with this token
          persist-credentials: false

      - name: Add the target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # make dist writes THIRD-PARTY-LICENSES with it. Not cached: a cache made
      # on one tag is not restored on the next.
      - name: Install cargo-about
        shell: bash
        run: cargo install cargo-about --version 0.9.2 --features cli --locked

      - name: Build the archive and its checksum
        shell: bash
        run: make dist TAG="$GITHUB_REF_NAME" TARGET=${{ matrix.target }}

      # itero-ai, the local model's server, in its own archive: it builds
      # llama.cpp from source (cmake is on every runner)
      - name: Build itero-ai's archive and its checksum
        shell: bash
        run: make dist-ai TAG="$GITHUB_REF_NAME" TARGET=${{ matrix.target }}

      - name: Upload them to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber

  publish:
    needs: build
    name: publish the release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write # undrafts the release
    steps:
      - name: Undraft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # Writes the version and the published checksums into the tap's formulas
  # (packaging/homebrew/itero.rb and itero-ai.rb are their sources). Needs TAP_TOKEN, a token
  # with contents:write on the tap: GITHUB_TOKEN cannot push there. Fails
  # loudly without it, since a stale tap serves an old version silently.
  tap:
    name: bump the homebrew formulas
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Write and push the formulas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_TOKEN is not set; the tap cannot be updated and would serve an old version." >&2
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir /tmp/sums
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/aegea-dev/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          for name in itero itero-ai; do
            sha() { awk '{print $1}' "/tmp/sums/$name-$tag-$1.sha256"; }
            # the file's order: macOS arm, macOS intel, Linux intel, Linux arm
            python3 - "$name" "$version" "$(sha aarch64-apple-darwin)" "$(sha x86_64-apple-darwin)" \
              "$(sha x86_64-unknown-linux-gnu)" "$(sha aarch64-unknown-linux-gnu)" <<'PY'
          import re, sys, pathlib
          name, version, *shas = sys.argv[1:7]
          s = pathlib.Path(f"packaging/homebrew/{name}.rb").read_text()
          s = re.sub(r'version "[^"]+"', f'version "{version}"', s, count=1)
          out, i = [], 0
          for line in s.split("\n"):
              if re.match(r'\s*sha256 "', line) and i < len(shas):
                  line = re.sub(r'"[^"]+"', f'"{shas[i]}"', line); i += 1
              out.append(line)
          assert i == 4, f"{name}: expected 4 sha256 lines, wrote {i}"
          pathlib.Path(f"/tmp/tap/Formula/{name}.rb").write_text("\n".join(out))
          PY
          done
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/itero.rb Formula/itero-ai.rb
          if git diff --cached --quiet; then
            echo "formula already current"
          else
            git commit -m "itero and itero-ai $version"
            git push
          fi
