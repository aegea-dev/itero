name: Test

# Formatting, cargo check, clippy and the test suite on every pull request
# and on main, on Linux and macOS, and the tests that need Docker on Linux:
# the same make targets as on a development machine. Cargo.lock's audit is
# in audit.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A build in CI starts from the cache, never from the last edit:
# incremental data only fills the cache (and the runner's disk).
env:
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      # a failure on one system must not hide the other's result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup installs the toolchain and components rust-toolchain.toml
      # names, the one place the version is written.
      - name: Install the toolchain
        run: rustup toolchain install

      # The Linux runner's disk filled up while the cache was restored:
      # tools these jobs never use go first (about 20 GB).
      - name: Room on the disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # v2: the cache from before CARGO_INCREMENTAL=0 is not restored
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      - name: Formatting
        run: make fmt-check

      - name: Check
        run: make check

      - name: Clippy
        run: make lint-check

      - name: Tests
        run: make test

      # The Linux release is a static musl build: itero's tests on it too.
      # musl-gcc (musl-tools) builds the C in it.
      - name: Tests on musl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          rustup target add x86_64-unknown-linux-musl
          make test-musl

  # Container actions and the IMAP, POP3 and Gmail tests against GreenMail:
  # they need Docker, which the Linux runner has and the macOS one does not.
  docker:
    name: test-docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: rustup toolchain install

      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-docker-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docker-v2-

      # the gmail example's connector needs imaplib's idle: Python 3.14 or later
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Tests with Docker
        run: make test-docker
