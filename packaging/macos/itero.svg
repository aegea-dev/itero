<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Itero.app's icon, a placeholder until the logo: a chain of four
       steps, each its own kind (circle, triangle, square, hexagon), joined
       into one. make icon builds Itero.icns from it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#0f1d30"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <path d="M580 744 L444 590 L580 434 L444 280"
        fill="none" stroke="#e8eef6" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="580" cy="744" r="62" fill="#f2a541"/>
  <polygon points="444,512 376,628 512,628" fill="#e4572e" stroke="#e4572e" stroke-width="16" stroke-linejoin="round"/>
  <rect x="528" y="382" width="104" height="104" rx="12" fill="#4cb944"/>
  <polygon points="510,280 478,337 412,337 378,280 412,222 478,222" fill="#3fa7d6"/>
