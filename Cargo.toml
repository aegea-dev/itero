[package]
name = "itero"
version = "0.6.1"
edition = "2024"
license = "Apache-2.0"
description = "Runs workflows again and again: schedules, events, steps, workers"
repository = "https://github.com/aegea-dev/itero"

[dependencies]
clap = { version = "~4.6.6", features = ["derive"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = { version = "~1.0.151", features = ["preserve_order"] }
chrono = "~0.4.45"
anyhow = "~1.0.104"
sha2 = "~0.11.1"
humantime = "~2.4.0"
rusqlite = { version = "~0.40.2", features = ["bundled"] }
uuid = { version = "~1.28.0", features = ["v7"] }
# native-tls, not the default rustls: its aws-lc-rs is not MIT or Apache-2.0
reqwest = { version = "~0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "http2"] }
wait-timeout = "~0.2.1"
keyring = "~4.2.0"
rpassword = "~7.5.4"
croner = "~4.0.1"
service-manager = "~0.11.0"
axum = "~0.8.9"
tokio = { version = "~1.53.1", features = ["rt-multi-thread", "net", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "~0.2.190"

# itero-notifier: notifications as itero (Itero.app), through UserNotifications
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "~0.6.5"
objc2-foundation = { version = "~0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-user-notifications = { version = "~0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
block2 = "~0.6.2"

[dev-dependencies]
tempfile = "~3.27.0"
tower = { version = "~0.5.3", features = ["util"] }
