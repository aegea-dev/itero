<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c66ab"/>
      <stop offset="1" stop-color="#163d75"/>
    </linearGradient>
    <clipPath id="upper"><rect x="0" y="0" width="512" height="274"/></clipPath>
  </defs>

  <!-- bottom: half a sphere -->
  <path d="M56 272 A200 200 0 0 0 456 272 Z" fill="#163d75"/>

  <!-- top: a wave rising from the left, its lip curling over and down -->
  <g clip-path="url(#upper)">
    <path d="M56 274 C 56 176, 134 92, 246 84 C 330 78, 392 116, 404 172
             C 410 200, 394 220, 374 210
             C 384 184, 362 152, 326 152 C 286 154, 270 200, 298 242
             C 306 256, 316 266, 330 274 Z" fill="url(#body)"/>
    <g fill="none" stroke="#5e95d1" stroke-width="7" stroke-linecap="round" opacity="0.7">
      <path d="M92 262 C 92 190, 150 124, 236 116"/>
      <path d="M130 262 C 132 206, 176 156, 238 148"/>
      <path d="M176 262 C 180 222, 210 190, 252 182"/>
    </g>
  </g>

  <!-- where the wave meets the sphere: a line of foam -->
  <path d="M56 272 L 456 272" stroke="#f4efe2" stroke-width="5" stroke-linecap="round"/>
</svg>
