# A page, summarized by a model on this machine, on request. The model
# runs in LM Studio, its server on http://localhost:1234 with
# openai/gpt-oss-20b loaded (actions/ask-ai names both). Its API token is
# $$LM_STUDIO_TOKEN: exported in the shell that starts the daemon, or kept
# with `itero secret LM_STUDIO_TOKEN`.
#
# Run `itero daemon` in this folder, then from another terminal:
#   itero emit website.requested '{"url": "https://example.com"}'
# The summary shows in the daemon's terminal. The actions need curl, jq
# and perl.
port = 8792
